        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="action_goto_action_0nji5tn_di" bpmnElement="action_goto_action_0nji5tn">
          <dc:Bounds x="350" y="30" width="100" height="80"/>
        </bpmndi:BPMNShape>
        <bpmndi:BPMNEdge id="eca_scalar_1q09u8b_di" bpmnElement="eca_scalar_1q09u8b">
