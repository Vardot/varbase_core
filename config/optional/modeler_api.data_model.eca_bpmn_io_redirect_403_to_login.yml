        <bpmndi:BPMNEdge id="eca_current_user_role_14bo1m1_di" bpmnElement="eca_current_user_role_14bo1m1">
          <di:waypoint x="275" y="70"/>
          <di:waypoint x="350" y="70"/>
          <bpmndi:BPMNLabel>
            <dc:Bounds x="284" y="45" width="59" height="14"/>
          </bpmndi:BPMNLabel>
        </bpmndi:BPMNEdge>
      </bpmndi:BPMNPlane>
    </bpmndi:BPMNDiagram>
  </bpmn2:definitions>
