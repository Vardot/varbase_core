        <bpmndi:BPMNShape id="TextAnnotation_1r3r3r3_di" bpmnElement="TextAnnotation_1r3r3r3" bioc:stroke="#6b3c00" bioc:fill="#ffe0b2" color:background-color="#ffe0b2" color:border-color="#6b3c00">
