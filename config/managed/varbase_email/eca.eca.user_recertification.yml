          Association_0gix5ur: eca_switch_service_account_119z0mm
          Association_1glwvss: eca_switch_service_account_119z0mm
      TextAnnotation_3a2a2a2:
        text: 'Query the count of users who have not logged in for 100 days or more and should be blocked.'
        assigned_to:
          Association_1diixqb: eca_views_query_0gcdnmj
      TextAnnotation_3a3a3a3:
        text: 'Render the list of users to be blocked as an HTML table to be included in the email notification.'
        assigned_to:
          Association_19mmosj: eca_render_views__views_1
      TextAnnotation_3a4a4a4:
        text: 'Render the total count message showing how many users will be blocked.'
        assigned_to:
          Association_1w7cgjq: eca_render_views__views_2_1
      TextAnnotation_3a5a5a5:
        text: 'Get the list of users who need to be blocked from the system (100+ days without login).'
        assigned_to:
          Association_0jo6eic: eca_render_views__views_1_1
      TextAnnotation_3a6a6a6:
        text: 'Pop the first user from the list to process their account blocking.'
        assigned_to:
          Association_1ug5ozg: eca_list_remove_0lramrv
      TextAnnotation_3a7a7a7:
        text: 'Load the full user entity object to be able to perform the block action.'
        assigned_to:
          Association_15lbc2i: eca_token_load_entity_0spuobp
      TextAnnotation_3a8a8a8:
        text: 'Block the user account to prevent further logins due to prolonged inactivity (100+ days).'
        assigned_to:
          Association_048lstl: user_block_user_action_1d9s1ry
      TextAnnotation_3a9a9a9:
        text: 'Query the list of administrator users who will receive the blocked users notification.'
        assigned_to:
          Association_1617e11: eca_views_query_1je3clw
      TextAnnotation_3a0a0a0:
        text: 'Pop the first administrator user from the list to send them the notification email.'
        assigned_to:
          Association_0wgxpkt: eca_list_remove_1kpya7z
      TextAnnotation_3b1b1b1:
        text: 'Create the blocked users notification email entity with the rendered data.'
        assigned_to:
          Association_1x2prj4: eca_new_entity_1avbsci
      TextAnnotation_3b2b2b2:
        text: 'Queue the blocked users notification email to be sent.'
        assigned_to:
          Association_0lheqoq: easy_email_send_0981ohr
