    data: 'hash:2d8b15db500636a9d6231009854c9c09'
    changelog: Initialization
    label: 'User Recertification'
    documentation: 'Send email notifications when users log into their account for recertification tracking and security monitoring.'
    tags:
      - user
      - login
      - security
      - notification
      - session
    version: 1.0.0
    annotations:
      TextAnnotation_2a1a1a1:
        text: 'Scheduled cron job that runs daily at 3:00 AM to check for inactive user accounts.'
        assigned_to:
          Association_1kj1s1t: eca_base__eca_cron_2_1
      TextAnnotation_1jfp7hx:
        text: 'We require the service account to create email entities to be sent.'
        assigned_to:
          Association_1adxkws: eca_switch_service_account_0m4ckgw
          Association_0rvdnmb: eca_switch_service_account_0m4ckgw
          Association_0q8760r: eca_switch_service_account_0m4ckgw
          Association_1tk70og: eca_switch_service_account_0m4ckgw
      TextAnnotation_2a2a2a2:
        text: 'Query the count of users who have not logged in for 90 days or more.'
        assigned_to:
          Association_0ph5eov: eca_views_query_033e4yb
      TextAnnotation_2a3a3a3:
        text: 'Render the list of inactive users as an HTML table to be included in the email notification.'
        assigned_to:
          Association_01xwev7: eca_render_views__views_1_4
      TextAnnotation_2a4a4a4:
        text: 'Render the total count message showing how many users are inactive.'
        assigned_to:
          Association_1qb69gg: eca_render_views__views_1_3
      TextAnnotation_2a5a5a5:
        text: 'Query the list of administrator users who will receive the inactive users notification.'
        assigned_to:
          Association_0b6t9cf: eca_views_query_1i7pt4m
      TextAnnotation_2a6a6a6:
        text: 'Pop the first administrator user from the list to send them the notification email.'
        assigned_to:
          Association_1s0k2zj: eca_list_remove_13k1tx3
      TextAnnotation_2a7a7a7:
        text: 'Create the inactive users notification email entity with the rendered data.'
        assigned_to:
          Association_1637811: eca_new_entity_0p37h2i
      TextAnnotation_2a8a8a8:
        text: 'Queue the inactive users notification email to be sent.'
        assigned_to:
          Association_1rhv4kp: easy_email_send_1mm3zgc
      TextAnnotation_3a1a1a1:
        text: 'Scheduled cron job that runs daily at 3:00 AM to check for users that should be blocked.'
        assigned_to:
          Association_15j518a: eca_base__eca_cron_1_1
      TextAnnotation_1dpbrs9:
        text: 'We require the service account to create email entities to be sent.'
        assigned_to:
          Association_16ngw20: eca_switch_service_account_119z0mm
