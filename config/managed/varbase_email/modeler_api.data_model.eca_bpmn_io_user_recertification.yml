      <bpmn2:textAnnotation id="TextAnnotation_2a1a1a1">
        <bpmn2:text>Scheduled cron job that runs daily at 3:00 AM to check for inactive user accounts.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1kj1s1t" sourceRef="eca_base__eca_cron_2_1" targetRef="TextAnnotation_2a1a1a1" />
      <bpmn2:textAnnotation id="TextAnnotation_1jfp7hx">
        <bpmn2:text>We require the service account to create email entities to be sent.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1adxkws" sourceRef="eca_switch_service_account_0m4ckgw" targetRef="TextAnnotation_1jfp7hx" />
      <bpmn2:association id="Association_0rvdnmb" sourceRef="eca_switch_service_account_0m4ckgw" targetRef="TextAnnotation_1jfp7hx" />
      <bpmn2:association id="Association_0q8760r" sourceRef="eca_switch_service_account_0m4ckgw" targetRef="TextAnnotation_1jfp7hx" />
      <bpmn2:association id="Association_1tk70og" sourceRef="eca_switch_service_account_0m4ckgw" targetRef="TextAnnotation_1jfp7hx" />
      <bpmn2:textAnnotation id="TextAnnotation_2a2a2a2">
        <bpmn2:text>Query the count of users who have not logged in for 90 days or more.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0ph5eov" sourceRef="eca_views_query_033e4yb" targetRef="TextAnnotation_2a2a2a2" />
      <bpmn2:textAnnotation id="TextAnnotation_2a3a3a3">
        <bpmn2:text>Render the list of inactive users as an HTML table to be included in the email notification.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_01xwev7" sourceRef="eca_render_views__views_1_4" targetRef="TextAnnotation_2a3a3a3" />
      <bpmn2:textAnnotation id="TextAnnotation_2a4a4a4">
        <bpmn2:text>Render the total count message showing how many users are inactive.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1qb69gg" sourceRef="eca_render_views__views_1_3" targetRef="TextAnnotation_2a4a4a4" />
      <bpmn2:textAnnotation id="TextAnnotation_2a5a5a5">
        <bpmn2:text>Query the list of administrator users who will receive the inactive users notification.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0b6t9cf" sourceRef="eca_views_query_1i7pt4m" targetRef="TextAnnotation_2a5a5a5" />
      <bpmn2:textAnnotation id="TextAnnotation_2a6a6a6">
        <bpmn2:text>Pop the first administrator user from the list to send them the notification email.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1s0k2zj" sourceRef="eca_list_remove_13k1tx3" targetRef="TextAnnotation_2a6a6a6" />
      <bpmn2:textAnnotation id="TextAnnotation_2a7a7a7">
        <bpmn2:text>Create the inactive users notification email entity with the rendered data.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1637811" sourceRef="eca_new_entity_0p37h2i" targetRef="TextAnnotation_2a7a7a7" />
      <bpmn2:textAnnotation id="TextAnnotation_2a8a8a8">
        <bpmn2:text>Queue the inactive users notification email to be sent.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1rhv4kp" sourceRef="easy_email_send_1mm3zgc" targetRef="TextAnnotation_2a8a8a8" />
      <bpmn2:textAnnotation id="TextAnnotation_3a1a1a1">
        <bpmn2:text>Scheduled cron job that runs daily at 3:00 AM to check for users that should be blocked.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_15j518a" sourceRef="eca_base__eca_cron_1_1" targetRef="TextAnnotation_3a1a1a1" />
      <bpmn2:textAnnotation id="TextAnnotation_1dpbrs9">
        <bpmn2:text>We require the service account to create email entities to be sent.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_16ngw20" sourceRef="eca_switch_service_account_119z0mm" targetRef="TextAnnotation_1dpbrs9" />
      <bpmn2:association id="Association_1xm5j5u" sourceRef="eca_switch_service_account_119z0mm" targetRef="TextAnnotation_1dpbrs9" />
      <bpmn2:association id="Association_0gix5ur" sourceRef="eca_switch_service_account_119z0mm" targetRef="TextAnnotation_1dpbrs9" />
      <bpmn2:association id="Association_1glwvss" sourceRef="eca_switch_service_account_119z0mm" targetRef="TextAnnotation_1dpbrs9" />
      <bpmn2:textAnnotation id="TextAnnotation_3a2a2a2">
        <bpmn2:text>Query the count of users who have not logged in for 100 days or more and should be blocked.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1diixqb" sourceRef="eca_views_query_0gcdnmj" targetRef="TextAnnotation_3a2a2a2" />
      <bpmn2:textAnnotation id="TextAnnotation_3a3a3a3">
        <bpmn2:text>Render the list of users to be blocked as an HTML table to be included in the email notification.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_19mmosj" sourceRef="eca_render_views__views_1" targetRef="TextAnnotation_3a3a3a3" />
      <bpmn2:textAnnotation id="TextAnnotation_3a4a4a4">
        <bpmn2:text>Render the total count message showing how many users will be blocked.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1w7cgjq" sourceRef="eca_render_views__views_2_1" targetRef="TextAnnotation_3a4a4a4" />
      <bpmn2:textAnnotation id="TextAnnotation_3a5a5a5">
        <bpmn2:text>Get the list of users who need to be blocked from the system (100+ days without login).</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0jo6eic" sourceRef="eca_render_views__views_1_1" targetRef="TextAnnotation_3a5a5a5" />
      <bpmn2:textAnnotation id="TextAnnotation_3a6a6a6">
        <bpmn2:text>Pop the first user from the list to process their account blocking.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1ug5ozg" sourceRef="eca_list_remove_0lramrv" targetRef="TextAnnotation_3a6a6a6" />
      <bpmn2:textAnnotation id="TextAnnotation_3a7a7a7">
        <bpmn2:text>Load the full user entity object to be able to perform the block action.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_15lbc2i" sourceRef="eca_token_load_entity_0spuobp" targetRef="TextAnnotation_3a7a7a7" />
      <bpmn2:textAnnotation id="TextAnnotation_3a8a8a8">
        <bpmn2:text>Block the user account to prevent further logins due to prolonged inactivity (100+ days).</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_048lstl" sourceRef="user_block_user_action_1d9s1ry" targetRef="TextAnnotation_3a8a8a8" />
      <bpmn2:textAnnotation id="TextAnnotation_3a9a9a9">
        <bpmn2:text>Query the list of administrator users who will receive the blocked users notification.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1617e11" sourceRef="eca_views_query_1je3clw" targetRef="TextAnnotation_3a9a9a9" />
      <bpmn2:textAnnotation id="TextAnnotation_3a0a0a0">
        <bpmn2:text>Pop the first administrator user from the list to send them the notification email.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0wgxpkt" sourceRef="eca_list_remove_1kpya7z" targetRef="TextAnnotation_3a0a0a0" />
      <bpmn2:textAnnotation id="TextAnnotation_3b1b1b1">
        <bpmn2:text>Create the blocked users notification email entity with the rendered data.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1x2prj4" sourceRef="eca_new_entity_1avbsci" targetRef="TextAnnotation_3b1b1b1" />
      <bpmn2:textAnnotation id="TextAnnotation_3b2b2b2">
        <bpmn2:text>Queue the blocked users notification email to be sent.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0lheqoq" sourceRef="easy_email_send_0981ohr" targetRef="TextAnnotation_3b2b2b2" />
    </bpmn2:process>
