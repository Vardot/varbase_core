id: user_login
weight: -10
events:
  user__login_1_1:
    plugin: 'user:login'
    label: 'Login of a user'
    configuration: {  }
    successors:
      -
        id: eca_token_load_user_current_02z4bqd
        condition: ''
conditions:
  eca_scalar_05vwl4k:
    plugin: eca_scalar
    label: 'Wrong status'
    configuration:
      negate: true
      left: '[logged_user_ip_http_request:status]'
      right: '200'
      operator: equal
      type: _eca_token
      case: false
  eca_scalar_1eogeqt:
    plugin: eca_scalar
    label: 'Has client error'
    configuration:
      negate: true
      left: '[logged_user_ip_http_request:client_error]'
      right: '0'
      operator: equal
      type: value
      case: false
  eca_scalar_135hmlg:
    plugin: eca_scalar
    label: Success
    configuration:
      negate: false
      left: '[logged_user_ip_http_request:json:success]'
      right: '1'
      operator: equal
      type: _eca_token
      case: false
gateways:
  Gateway_05l9ll7:
    type: 0
    successors:
      -
        id: eca_void_and_condition_0c22s5c
        condition: eca_scalar_05vwl4k
      -
        id: eca_token_set_value_1wjrilc
        condition: eca_scalar_135hmlg
actions:
  eca_token_load_user_current_02z4bqd:
    label: 'Get current user'
    plugin: eca_token_load_user_current
    configuration:
      token_name: logged_user
    successors:
      -
        id: eca_endpoint_get_request_header_019mwxp
        condition: ''
  eca_new_entity_0arypq1:
    label: 'Create Login Notification email'
    plugin: eca_new_entity
    configuration:
      token_name: login_notification
      type: 'easy_email login_notification'
      langcode: _interface
      label: 'Login Notification email template'
      published: false
      owner: ''
    successors:
      -
        id: easy_email_send_1h2m16e
        condition: ''
  easy_email_send_1h2m16e:
    label: 'Send Easy Email template about login event'
    plugin: easy_email_send
    configuration:
      object: login_notification
    successors: {  }
  eca_token_set_value_16qn0k8:
    label: 'Get current user IP address'
    plugin: eca_token_set_value
    configuration:
      token_name: logged_user_ip_address
      token_value: '[current-user:ip-address]'
      use_yaml: false
      validate_yaml: false
    successors:
      -
        id: eca_helper_http_request_0u7u22m
        condition: ''
  eca_endpoint_get_request_header_019mwxp:
    label: 'Get "User-Agent" header'
    plugin: eca_endpoint_get_request_header
    configuration:
      name: user-agent
      token_name: logged_user_agent
    successors:
      -
        id: eca_token_set_value_16qn0k8
        condition: ''
  eca_helper_http_request_0u7u22m:
    label: 'Get geolocation from IP'
    plugin: eca_helper_http_request
    configuration:
      method: get
      url: 'https://api.ipwho.org/ip/[logged_user_ip_address]'
      data: ''
      data_yaml: 'no'
      data_serialization: json
      query_parameters: ''
      headers: ''
      cookies: ''
      request_options: ''
      token_name: logged_user_ip_http_request
    successors:
      -
        id: Gateway_05l9ll7
        condition: ''
  eca_token_set_value_1lxlhd1:
    label: 'Failed to get gelocation'
    plugin: eca_token_set_value
    configuration:
      token_name: logged_user_location
      token_value: 'No info'
      use_yaml: false
      validate_yaml: false
    successors:
      -
        id: eca_switch_service_account_01jhzo9
        condition: ''
  eca_token_set_value_1wjrilc:
    label: 'Format geolocation'
    plugin: eca_token_set_value
    configuration:
      token_name: logged_user_location
      token_value: '[logged_user_ip_http_request:json:data:city], [logged_user_ip_http_request:json:data:region], [logged_user_ip_http_request:json:data:country]'
      use_yaml: false
      validate_yaml: false
    successors:
      -
        id: eca_switch_service_account_01jhzo9
        condition: ''
  eca_void_and_condition_0c22s5c:
    label: AND
    plugin: eca_void_and_condition
    configuration: {  }
    successors:
      -
        id: eca_token_set_value_1lxlhd1
        condition: eca_scalar_1eogeqt
  eca_switch_service_account_01jhzo9:
    label: 'Switch to service user'
    plugin: eca_switch_service_account
    configuration: {  }
    successors:
      -
        id: eca_new_entity_0arypq1
        condition: ''
