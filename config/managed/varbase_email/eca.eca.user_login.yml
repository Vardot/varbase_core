third_party_settings:
  modeler_api:
    modeler_id: bpmn_io
    data: 'hash:a279ba79d5738279f45faf6ac0453df2'
    label: 'User login notification'
    tags:
      - user
      - login
      - notification
    version: 1.0.0
    annotations:
      TextAnnotation_1lk6dax:
        text: 'Load the logged-in user object into a token to be used for later steps in this model.'
        assigned_to:
          Association_1dlb77j: eca_token_load_user_current_02z4bqd
          Association_13ep1gs: eca_token_load_user_current_02z4bqd
          Association_01uqitk: eca_token_load_user_current_02z4bqd
      TextAnnotation_0ybmp3c:
        text: "ECA Endpoint: Get the certain headers. Those headers would usually store the browser info and OS of the user's device – to be included in the email later on. Use https://www.httpdebugger.com/tools/viewbrowserheaders.aspx to diagnose."
        assigned_to:
          Association_0vo2v6q: eca_endpoint_get_request_header_019mwxp
          Association_1x59665: eca_endpoint_get_request_header_019mwxp
          Association_141npu5: eca_endpoint_get_request_header_019mwxp
      TextAnnotation_1ukyxgp:
        text: 'Initiates an HTTP request to a free IP geolocation service to get the location.'
        assigned_to:
          Association_1bvp88a: eca_helper_http_request_0u7u22m
          Association_02acys6: eca_helper_http_request_0u7u22m
      TextAnnotation_15ggpwl:
        text: 'We require the service account to create email entities to be sent.'
        assigned_to:
          Association_08rurre: eca_switch_service_account_01jhzo9
      TextAnnotation_0juz7x0:
        text: 'Have a fallback info in when the gelocation service did not get any info.'
        assigned_to:
          Association_15ewbws: eca_token_set_value_1lxlhd1
      TextAnnotation_1g7lxwi:
        text: 'Load the email template and assign email values.'
        assigned_to:
          Association_1d3eryj: eca_new_entity_0arypq1
      TextAnnotation_10wj6j6:
        text: "Arrange the geo location values as\_ City, County, Country."
        assigned_to:
          Association_1ognqby: eca_token_set_value_1wjrilc
      TextAnnotation_0ubmi50:
        text: 'Queue the email to be send.'
        assigned_to:
          Association_0b5c7fz: easy_email_send_1h2m16e
    colors:
      TextAnnotation_1lk6dax:
        fill: '#ffe0b2'
        stroke: '#6b3c00'
