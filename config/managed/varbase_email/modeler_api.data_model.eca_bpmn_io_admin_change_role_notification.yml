          <dc:Bounds x="1675" y="30" width="100" height="80" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="eca_tamper__find_replace_regex_2_di" bpmnElement="eca_tamper__find_replace_regex_2">
          <dc:Bounds x="325" y="30" width="100" height="80" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="eca_tamper__find_replace_regex_1_di" bpmnElement="eca_tamper__find_replace_regex_1">
          <dc:Bounds x="475" y="30" width="100" height="80" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="eca_switch_service_account_1ixry7l_di" bpmnElement="eca_switch_service_account_1ixry7l">
          <dc:Bounds x="625" y="30" width="100" height="80" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="eca_token_set_value_0ky9v6s_di" bpmnElement="eca_token_set_value_0ky9v6s">
          <dc:Bounds x="775" y="30" width="100" height="80" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="Gateway_1v6rp7s_di" bpmnElement="Gateway_1v6rp7s" isMarkerVisible="true">
          <dc:Bounds x="1250" y="45" width="50" height="50" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="Gateway_0mmeeyj_di" bpmnElement="Gateway_0mmeeyj" isMarkerVisible="true">
          <dc:Bounds x="950" y="45" width="50" height="50" />
        </bpmndi:BPMNShape>
        <bpmndi:BPMNShape id="TextAnnotation_1a2a2a2_di" bpmnElement="TextAnnotation_1a2a2a2" bioc:stroke="#6b3c00" bioc:fill="#ffe0b2" color:background-color="#ffe0b2" color:border-color="#6b3c00">
