id: eca_bpmn_io_admin_change_role_notification
data: |
  <?xml version="1.0" encoding="UTF-8"?>
  <bpmn2:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:camunda="http://camunda.org/schema/1.0/bpmn" xmlns:bioc="http://bpmn.io/schema/bpmn/biocolor/1.0" xmlns:color="http://www.omg.org/spec/BPMN/non-normative/color/1.0" xmlns:qa="http://some-company/schema/bpmn/qa" id="sample-diagram" targetNamespace="http://bpmn.io/schema/bpmn" xsi:schemaLocation="http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd">
    <bpmn2:process id="admin_change_role_notification" name="Admin Change Role Notification" isExecutable="true" camunda:versionTag="1.0.0">
      <bpmn2:documentation />
      <bpmn2:extensionElements>
        <camunda:properties>
          <camunda:property name="Tags" value="user,login,security,notification,session" />
          <camunda:property name="Changelog" value="" />
        </camunda:properties>
      </bpmn2:extensionElements>
      <bpmn2:startEvent id="content_entity__update_1" name="Update user" camunda:modelerTemplate="org.drupal.event.content_entity:update">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="content_entity:update" />
          </camunda:properties>
          <camunda:field name="type">
            <camunda:string>user user</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:outgoing>eca_entity_field_value_changed_1ismzxl</bpmn2:outgoing>
      </bpmn2:startEvent>
      <bpmn2:task id="eca_views_query_1fpilr2" name="Get admin users to notify" camunda:modelerTemplate="org.drupal.action.eca_views_query">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_views_query" />
          </camunda:properties>
          <camunda:field name="token_name">
            <camunda:string>admin_users</camunda:string>
          </camunda:field>
          <camunda:field name="view_id">
            <camunda:string>eca_admin_users</camunda:string>
          </camunda:field>
          <camunda:field name="display_id">
            <camunda:string>admin_users</camunda:string>
          </camunda:field>
          <camunda:field name="arguments">
            <camunda:string></camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>eca_list_contains_18iebuj</bpmn2:incoming>
        <bpmn2:outgoing>Flow_0m8pfis</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_list_remove_1n0pvsd" name="Pop first admin from list" camunda:modelerTemplate="org.drupal.action.eca_list_remove">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_list_remove" />
          </camunda:properties>
          <camunda:field name="value">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="token_name">
            <camunda:string>admin_user</camunda:string>
          </camunda:field>
          <camunda:field name="method">
            <camunda:string>first</camunda:string>
          </camunda:field>
          <camunda:field name="index">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="list_token">
            <camunda:string>admin_users</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>eca_count_0qprpab</bpmn2:incoming>
        <bpmn2:outgoing>Flow_0ebxw65</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_token_set_value_01noukj" name="Store updated user" camunda:modelerTemplate="org.drupal.action.eca_token_set_value">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_token_set_value" />
          </camunda:properties>
          <camunda:field name="token_name">
            <camunda:string>updated_user</camunda:string>
          </camunda:field>
          <camunda:field name="token_value">
            <camunda:string>[entity]</camunda:string>
          </camunda:field>
          <camunda:field name="use_yaml">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="validate_yaml">
            <camunda:string>no</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>eca_entity_field_value_changed_1ismzxl</bpmn2:incoming>
        <bpmn2:outgoing>Flow_1ro3rn9</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_new_entity_1lwoqgx" name="Create notification email" camunda:modelerTemplate="org.drupal.action.eca_new_entity">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_new_entity" />
          </camunda:properties>
          <camunda:field name="token_name">
            <camunda:string>role_changed_notification</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>easy_email role_changed_notification</camunda:string>
          </camunda:field>
          <camunda:field name="langcode">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="label">
            <camunda:string>User Role Modified - [updated_user:display-name] on [site:name]</camunda:string>
          </camunda:field>
          <camunda:field name="published">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="owner">
            <camunda:string>1</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_0ebxw65</bpmn2:incoming>
        <bpmn2:outgoing>Flow_0r6vi2b</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="easy_email_send_1ida814" name="Send notification email" camunda:modelerTemplate="org.drupal.action.easy_email_send">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="easy_email_send" />
          </camunda:properties>
          <camunda:field name="object">
            <camunda:string>role_changed_notification</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_0r6vi2b</bpmn2:incoming>
        <bpmn2:outgoing>Flow_05cwedi</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_tamper__find_replace_regex_2" name="Filter original roles" camunda:modelerTemplate="org.drupal.action.eca_tamper:find_replace_regex">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_tamper:find_replace_regex" />
          </camunda:properties>
          <camunda:field name="find">
            <camunda:string>/authenticated,/</camunda:string>
          </camunda:field>
          <camunda:field name="replace">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="limit">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="eca_data">
            <camunda:string>[user:original:roles]</camunda:string>
          </camunda:field>
          <camunda:field name="eca_token_name">
            <camunda:string>user_original_roles</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_1ro3rn9</bpmn2:incoming>
        <bpmn2:outgoing>Flow_0m6pws4</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_tamper__find_replace_regex_1" name="Filter new roles &#38; trim" camunda:modelerTemplate="org.drupal.action.eca_tamper:find_replace_regex">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_tamper:find_replace_regex" />
          </camunda:properties>
          <camunda:field name="find">
            <camunda:string>/(authenticated,\s*)/</camunda:string>
          </camunda:field>
          <camunda:field name="replace">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="limit">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="eca_data">
            <camunda:string>[user:roles]</camunda:string>
          </camunda:field>
          <camunda:field name="eca_token_name">
            <camunda:string>user_new_roles</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_0m6pws4</bpmn2:incoming>
        <bpmn2:outgoing>Flow_0jq6e4d</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_switch_service_account_1ixry7l" name="Switch to service account" camunda:modelerTemplate="org.drupal.action.eca_switch_service_account">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_switch_service_account" />
          </camunda:properties>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_0jq6e4d</bpmn2:incoming>
        <bpmn2:outgoing>Flow_19mbtyi</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="eca_token_set_value_0ky9v6s" name="Set admin roles list" camunda:modelerTemplate="org.drupal.action.eca_token_set_value">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_token_set_value" />
          </camunda:properties>
          <camunda:field name="token_name">
            <camunda:string>admin_user_roles</camunda:string>
          </camunda:field>
          <camunda:field name="token_value">
            <camunda:string>content_admin,seo_admin,site_admin,administrator</camunda:string>
          </camunda:field>
          <camunda:field name="use_yaml">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="validate_yaml">
            <camunda:string>no</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_19mbtyi</bpmn2:incoming>
        <bpmn2:outgoing>Flow_10vqtcm</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:exclusiveGateway id="Gateway_1v6rp7s">
        <bpmn2:incoming>Flow_0m8pfis</bpmn2:incoming>
        <bpmn2:incoming>Flow_05cwedi</bpmn2:incoming>
        <bpmn2:outgoing>eca_count_0qprpab</bpmn2:outgoing>
      </bpmn2:exclusiveGateway>
      <bpmn2:exclusiveGateway id="Gateway_0mmeeyj">
        <bpmn2:incoming>Flow_10vqtcm</bpmn2:incoming>
        <bpmn2:outgoing>eca_list_contains_18iebuj</bpmn2:outgoing>
      </bpmn2:exclusiveGateway>
      <bpmn2:sequenceFlow id="eca_entity_field_value_changed_1ismzxl" name="User roles changed?" camunda:modelerTemplate="org.drupal.condition.eca_entity_field_value_changed" sourceRef="content_entity__update_1" targetRef="eca_token_set_value_01noukj">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_entity_field_value_changed" />
          </camunda:properties>
          <camunda:field name="negate">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="field_name">
            <camunda:string>roles</camunda:string>
          </camunda:field>
          <camunda:field name="entity">
            <camunda:string>user</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:sequenceFlow id="Flow_0m8pfis" sourceRef="eca_views_query_1fpilr2" targetRef="Gateway_1v6rp7s" />
      <bpmn2:sequenceFlow id="Flow_0ebxw65" sourceRef="eca_list_remove_1n0pvsd" targetRef="eca_new_entity_1lwoqgx" />
      <bpmn2:sequenceFlow id="Flow_1ro3rn9" sourceRef="eca_token_set_value_01noukj" targetRef="eca_tamper__find_replace_regex_2" />
      <bpmn2:sequenceFlow id="Flow_0r6vi2b" sourceRef="eca_new_entity_1lwoqgx" targetRef="easy_email_send_1ida814" />
      <bpmn2:sequenceFlow id="Flow_05cwedi" sourceRef="easy_email_send_1ida814" targetRef="Gateway_1v6rp7s" />
      <bpmn2:sequenceFlow id="Flow_0m6pws4" sourceRef="eca_tamper__find_replace_regex_2" targetRef="eca_tamper__find_replace_regex_1" />
      <bpmn2:sequenceFlow id="Flow_0jq6e4d" sourceRef="eca_tamper__find_replace_regex_1" targetRef="eca_switch_service_account_1ixry7l" />
      <bpmn2:sequenceFlow id="Flow_19mbtyi" sourceRef="eca_switch_service_account_1ixry7l" targetRef="eca_token_set_value_0ky9v6s" />
      <bpmn2:sequenceFlow id="Flow_10vqtcm" sourceRef="eca_token_set_value_0ky9v6s" targetRef="Gateway_0mmeeyj" />
      <bpmn2:sequenceFlow id="eca_count_0qprpab" name="Has admin recipients?" camunda:modelerTemplate="org.drupal.condition.eca_count" sourceRef="Gateway_1v6rp7s" targetRef="eca_list_remove_1n0pvsd">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_count" />
          </camunda:properties>
          <camunda:field name="negate">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="left">
            <camunda:string>admin_users</camunda:string>
          </camunda:field>
          <camunda:field name="right">
            <camunda:string>0</camunda:string>
          </camunda:field>
          <camunda:field name="operator">
            <camunda:string>greaterthan</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>_eca_token</camunda:string>
          </camunda:field>
          <camunda:field name="case">
            <camunda:string>no</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:sequenceFlow id="eca_list_contains_18iebuj" name="Is admin role? (not editor)" camunda:modelerTemplate="org.drupal.condition.eca_list_contains" sourceRef="Gateway_0mmeeyj" targetRef="eca_views_query_1fpilr2">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_list_contains" />
          </camunda:properties>
          <camunda:field name="negate">
            <camunda:string>yes</camunda:string>
          </camunda:field>
          <camunda:field name="list_token">
            <camunda:string>user_new_roles</camunda:string>
          </camunda:field>
          <camunda:field name="method">
            <camunda:string>_eca_token</camunda:string>
          </camunda:field>
          <camunda:field name="value">
            <camunda:string>editor</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:textAnnotation id="TextAnnotation_1a2a2a2">
        <bpmn2:text>Store the updated user entity into a token to be used for later steps in this model.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0944uvz" sourceRef="eca_token_set_value_01noukj" targetRef="TextAnnotation_1a2a2a2" />
      <bpmn2:textAnnotation id="TextAnnotation_1a3a3a3">
        <bpmn2:text>Filter out the 'authenticated' role from the original roles list, keeping only the meaningful roles that were changed.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_11p8hn2" sourceRef="eca_tamper__find_replace_regex_2" targetRef="TextAnnotation_1a3a3a3" />
      <bpmn2:textAnnotation id="TextAnnotation_1a4a4a4">
        <bpmn2:text>Filter out the 'authenticated' role from the new roles list, keeping only the meaningful roles that were added.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1t1uz60" sourceRef="eca_tamper__find_replace_regex_1" targetRef="TextAnnotation_1a4a4a4" />
      <bpmn2:textAnnotation id="TextAnnotation_1sdif9m">
        <bpmn2:text>We require the service account to create email entities to be sent.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1b1jses" sourceRef="eca_switch_service_account_1ixry7l" targetRef="TextAnnotation_1sdif9m" />
      <bpmn2:textAnnotation id="TextAnnotation_1a5a5a5">
        <bpmn2:text>Query the list of administrator users who will receive the role change notification.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0d5tqjo" sourceRef="eca_views_query_1fpilr2" targetRef="TextAnnotation_1a5a5a5" />
      <bpmn2:textAnnotation id="TextAnnotation_1a6a6a6">
        <bpmn2:text>Pop the first administrator user from the list to send them the notification email.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0vbwd1k" sourceRef="eca_list_remove_1n0pvsd" targetRef="TextAnnotation_1a6a6a6" />
      <bpmn2:textAnnotation id="TextAnnotation_1a7a7a7">
        <bpmn2:text>Create the role change notification email entity with the user and role information.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1d2k3c9" sourceRef="eca_new_entity_1lwoqgx" targetRef="TextAnnotation_1a7a7a7" />
      <bpmn2:textAnnotation id="TextAnnotation_1a8a8a8">
        <bpmn2:text>Queue the role change notification email to be sent.</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_152mae4" sourceRef="easy_email_send_1ida814" targetRef="TextAnnotation_1a8a8a8" />
      <bpmn2:textAnnotation id="TextAnnotation_1a9a9a9">
        <bpmn2:text>Check if roles changed</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_0cd2jy1" sourceRef="eca_entity_field_value_changed_1ismzxl" targetRef="TextAnnotation_1a9a9a9" />
      <bpmn2:textAnnotation id="TextAnnotation_1b1b1b1">
        <bpmn2:text>Verify admins available</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1rbelwl" sourceRef="eca_count_0qprpab" targetRef="TextAnnotation_1b1b1b1" />
      <bpmn2:textAnnotation id="TextAnnotation_1b2b2b2">
        <bpmn2:text>Only for admin roles (NOT editor/authenticated)</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1xoskkx" sourceRef="eca_list_contains_18iebuj" targetRef="TextAnnotation_1b2b2b2" />
      <bpmn2:textAnnotation id="TextAnnotation_1b3b3b3">
        <bpmn2:text>Admin roles: content_admin, seo_admin, site_admin, administrator</bpmn2:text>
      </bpmn2:textAnnotation>
      <bpmn2:association id="Association_1i1rg9h" sourceRef="eca_token_set_value_0ky9v6s" targetRef="TextAnnotation_1b3b3b3" />
    </bpmn2:process>
