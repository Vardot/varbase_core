      TextAnnotation_1a4a4a4:
        text: "Filter out the 'authenticated' role from the new roles list, keeping only the meaningful roles that were added."
        assigned_to:
          Association_1t1uz60: eca_tamper__find_replace_regex_1
      TextAnnotation_1sdif9m:
        text: 'We require the service account to create email entities to be sent.'
        assigned_to:
          Association_1b1jses: eca_switch_service_account_1ixry7l
      TextAnnotation_1a5a5a5:
        text: 'Query the list of administrator users who will receive the role change notification.'
