langcode: en
status: true
dependencies: {  }
id: welcome_to_varbase
label: 'Welcome to Varbase'
routes:
  -
    route_name: '<front>'
tips:
  tour_switch:
    id: tour_switch
    plugin: text
    label: 'Tour Switch'
    weight: -100
    position: bottom
    selector: '.top-bar__tools .toolbar-button--icon--help'
    body: '<p>Remember! You can always switch on or off the tour from this button. Tours will give you valuable tips and information while navigating through your site.</p>'
  editing_your_homepage_layout:
    id: editing_your_homepage_layout
    plugin: text
    label: 'Editing Your Homepage Layout'
    weight: -90
    position: top-end
    selector: '.top-bar__actions .toolbar-button.toolbar-button--icon--dots'
    body: '<p>You can change your homepage layout and customize what appears in it from the <b>More Actions</b> navigation top bar button</p>'
  start_configuring_your_site_structure:
    id: start_configuring_your_site_structure
    plugin: text
    label: 'Configure Your Site Structure'
    weight: -80
    position: left
    selector: '#navigation-link-systemadmin-structure'
    body: '<p>Define your content types, fields, taxonomy, views, and other structural building blocks from here.</p>'
  define_your_site_settings:
    id: define_your_site_settings
    plugin: text
    label: 'Define Your Site Settings'
    weight: -70
    position: left
    selector: '#navigation-link-systemadmin-config'
    body: '<p>Other configuration for your site such as registration, search settings, web services, multilingual settings and content authoring can be managed from here.</p>'
  sites_content:
    id: sites_content
    plugin: text
    label: 'Site Content'
    weight: -60
    position: left
    selector: '#navigation-link-navigationcontent'
    body: "<p>All your site's content, media, and files can be found here.</p>"
  your_dashboard:
    id: your_dashboard
    plugin: text
    label: 'Your Dashboard'
    weight: -60
    position: left
    selector: '#navigation-link--dashboard'
    body: "<p>Your dashboard includes quick links for creating content, viewing content stats, and a Google Analytics overview of your site's traffic once you go live.</p>"
