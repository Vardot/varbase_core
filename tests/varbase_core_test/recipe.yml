name: 'Varbase Core Test'
description: 'Provisions a site for the Varbase Core automated browser tests: installs Varbase Core, Varbase Page (for the /node/add/page form) and Honeypot, provisions the Basic page content type with a Body field (the install profile no longer ships it), and relaxes Honeypot time protection on the login forms so the automated tests can sign in. The heavier submodules are intentionally left out so the install completes within the CI browser-job time budget.'
type: 'Testing'
install:
  - node
  - text
  - field
  - varbase_core
  - varbase_page
  - honeypot
config:
  actions:
    honeypot.settings:
      simpleConfigUpdate:
        time_limit: 0
        form_settings:
          user_login_form: false
          user_register_form: false
          user_pass: false
